<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap');
    :root{
      --bg:#0B0B0D; --surface:#151519; --surface2:#1E1E24; --line:rgba(255,255,255,.07);
      --tx:#ECECEA; --dim:#9A9AA2; --faint:#63636B;
      --gold:#CBA35A; --teal:#5FB0A5; --amber:#DB965A; --red:#D26A60;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Noto Sans JP',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
    .disp{font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif}
    a{color:var(--gold)} a:hover{color:#dcb877}
    .screen{width:390px;min-height:900px;position:relative;
      background:radial-gradient(130% 55% at 50% -8%, #18181E 0%, #0B0B0D 52%);
      padding:26px 20px 96px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
    .wm{font-family:'Zen Kaku Gothic New';font-weight:900;letter-spacing:.32em;font-size:13px;color:var(--gold)}
    .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  </style>
</helmet>
<div class="screen">

  <!-- header -->
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px">
    <div>
      <div class="wm">PRIME</div>
      <div style="margin-top:10px;font-size:12px;color:var(--dim)">8月24日 (月)</div>
      <div class="disp" style="font-size:20px;font-weight:700;margin-top:2px">おはようございます、Ken さん</div>
    </div>
    <div style="width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--dim)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </div>
  </div>

  <!-- muscle protection status -->
  <div class="card" style="padding:16px 16px 15px;border-color:rgba(219,150,90,.35);background:linear-gradient(180deg,rgba(219,150,90,.10),var(--surface));margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:11px">
      <div style="width:34px;height:34px;border-radius:10px;background:rgba(219,150,90,.16);display:flex;align-items:center;justify-content:center;color:var(--amber);flex:none">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="disp" style="font-weight:700;font-size:15px">筋肉保護モード</span>
          <span style="font-size:10px;font-weight:700;letter-spacing:.08em;color:#0B0B0D;background:var(--amber);padding:2px 7px;border-radius:6px">ON</span>
        </div>
        <div style="font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.5">睡眠 5時間32分を検知。減量ペースを <b style="color:var(--tx)">週 0.5%</b> に自動調整しました。</div>
      </div>
    </div>
  </div>

  <!-- today's plan -->
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px">
    <div class="disp" style="font-size:16px;font-weight:700">今日のプラン</div>
    <div style="font-size:11px;color:var(--faint)">コンカレント順</div>
  </div>

  <div class="card" style="padding:6px 4px;margin-bottom:16px">
    <!-- step 1 strength -->
    <div style="display:flex;align-items:center;gap:13px;padding:13px 14px">
      <div style="width:40px;height:40px;border-radius:12px;background:rgba(203,163,90,.14);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:14px">① 筋トレ ・ 胸 / 三頭</div>
        <div style="font-size:11.5px;color:var(--dim);margin-top:2px">45分 ・ 6種目 ・ RIR 1〜2</div>
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--gold);border:1px solid rgba(203,163,90,.4);padding:6px 11px;border-radius:9px">開始</div>
    </div>
    <div style="height:1px;background:var(--line);margin:0 14px"></div>
    <!-- step 2 cardio locked -->
    <div style="display:flex;align-items:center;gap:13px;padding:13px 14px;opacity:.62">
      <div style="width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="6"/><rect x="9" y="10.5" width="6" height="5" rx="1.4"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:14px">② 有酸素 ・ 25分</div>
        <div style="font-size:11.5px;color:var(--faint);margin-top:2px">筋トレ完了で解放されます</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
  </div>

  <!-- NEAT + volume row -->
  <div style="display:flex;gap:12px;margin-bottom:16px">
    <!-- NEAT ring -->
    <div class="card" style="flex:1;padding:16px 14px;text-align:center">
      <div style="position:relative;width:96px;height:96px;margin:2px auto 0">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="40" fill="none" stroke="#26262C" stroke-width="8"/>
          <circle cx="48" cy="48" r="40" fill="none" stroke="var(--teal)" stroke-width="8" stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="59" transform="rotate(-90 48 48)"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div class="disp" style="font-size:22px;font-weight:900;line-height:1">6,120</div>
          <div style="font-size:10px;color:var(--faint)">/ 8,000 歩</div>
        </div>
      </div>
      <div style="margin-top:11px;font-size:11px;font-weight:700;color:var(--amber);background:rgba(219,150,90,.12);display:inline-block;padding:4px 9px;border-radius:7px">筋トレ日・厳格監視</div>
    </div>
    <!-- weekly volume -->
    <div class="card" style="flex:1;padding:16px 15px">
      <div style="font-size:12px;color:var(--dim);margin-bottom:2px">週間ボリューム</div>
      <div style="font-size:10px;color:var(--faint);margin-bottom:14px">目標 10〜20 set</div>
      <div style="display:flex;flex-direction:column;gap:13px">
        <div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px"><span>胸</span><span style="color:var(--teal)">14</span></div>
          <div style="height:6px;background:#26262C;border-radius:3px"><div style="width:78%;height:100%;background:var(--teal);border-radius:3px"></div></div>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px"><span>背中</span><span style="color:var(--teal)">16</span></div>
          <div style="height:6px;background:#26262C;border-radius:3px"><div style="width:88%;height:100%;background:var(--teal);border-radius:3px"></div></div>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px"><span>脚</span><span style="color:var(--amber)">7</span></div>
          <div style="height:6px;background:#26262C;border-radius:3px"><div style="width:38%;height:100%;background:var(--amber);border-radius:3px"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- bottom nav -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:74px;background:rgba(12,12,14,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 8px 14px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--gold)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
      <span style="font-size:9.5px;font-weight:700">ホーム</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/></svg>
      <span style="font-size:9.5px">プラン</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      <span style="font-size:9.5px">記録</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3"/></svg>
      <span style="font-size:9.5px">分析</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      <span style="font-size:9.5px">マイ</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
